spring.application.name=itjobhub
server.port=9999

# Active local profile by default for local development
spring.profiles.active=local

# ===== Database =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/itjobhub_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# ===== Google OAuth (Google Identity Services) =====
app.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id}

# ===== Mail (SMTP Gmail) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_mail_password_here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true